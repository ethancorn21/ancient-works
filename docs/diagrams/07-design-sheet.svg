<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1044" viewBox="0 0 960 1044" font-family="Old Standard TT, Century Schoolbook, Iowan Old Style, Georgia, serif" fill="#2B2724">
  <title>Ancient Works design sheet, as implemented 2026-10-11</title>
  <!-- values copied from web/index.html :root (L15-19) and the marker/chip rules (L132-179); nothing invented -->
  <rect width="960" height="1044" fill="#F3EDDC"/>
  <!-- the plate border: 1px ink, 1px rule outline offset 3px (as .panel / .sheet) -->
  <rect x="20" y="20" width="920" height="1004" fill="#F8F4E8" stroke="#2B2724" stroke-width="1"/>
  <rect x="16.5" y="16.5" width="927" height="1011" fill="none" stroke="#8E8478" stroke-width="1"/>

  <!-- strip + wordmark (.strip .caps, .wordmark, .tagline) -->
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#6B625A">
    <text x="36" y="42">ANCIENT WORKS</text>
    <text x="924" y="42" text-anchor="end">DESIGN SHEET  ·  AS IMPLEMENTED 2026-10-11  ·  web/index.html</text>
  </g>
  <text x="480" y="78" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="3.1">ANCIENT WORKS</text>
  <text x="480" y="98" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6B625A">Old earthworks in old surveys and today's ground</text>
  <line x1="36" y1="112" x2="924" y2="112" stroke="#2B2724" stroke-width="1"/>

  <!-- ===== 1. palette ===== -->
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
    <text x="480" y="138" text-anchor="middle">PALETTE AS IMPLEMENTED (:ROOT TOKENS, THEN HARD-CODED LITERALS)</text>
  </g>
  <g stroke="#2B2724" stroke-width="1">
    <!-- row 1: paper and ink tokens -->
    <rect x="50"  y="150" width="112" height="44" fill="#F3EDDC"/>
    <rect x="174" y="150" width="112" height="44" fill="#EAE2CC"/>
    <rect x="298" y="150" width="112" height="44" fill="#F8F4E8"/>
    <rect x="422" y="150" width="112" height="44" fill="#2B2724"/>
    <rect x="546" y="150" width="112" height="44" fill="#6B625A"/>
    <rect x="670" y="150" width="112" height="44" fill="#8E8478"/>
    <rect x="794" y="150" width="112" height="44" fill="#CE2E4E"/>
    <!-- row 2: the seven pastels -->
    <rect x="50"  y="252" width="112" height="44" fill="#D8BCD5"/>
    <rect x="174" y="252" width="112" height="44" fill="#B996B6"/>
    <rect x="298" y="252" width="112" height="44" fill="#F2B5C4"/>
    <rect x="422" y="252" width="112" height="44" fill="#9ED8D8"/>
    <rect x="546" y="252" width="112" height="44" fill="#C4D9A6"/>
    <rect x="670" y="252" width="112" height="44" fill="#CFC6E0"/>
    <rect x="794" y="252" width="112" height="44" fill="#F2C48D"/>
    <!-- row 3: hard-coded, no token -->
    <rect x="50"  y="354" width="112" height="44" fill="#8A1230"/>
    <rect x="174" y="354" width="112" height="44" fill="#E2697F"/>
    <rect x="298" y="354" width="112" height="44" fill="#F4B4C0"/>
    <rect x="422" y="354" width="112" height="44" fill="#A9C4EC"/>
    <rect x="546" y="354" width="112" height="44" fill="#F0E08A"/>
    <rect x="670" y="354" width="112" height="44" fill="#C4DEDC"/>
    <rect x="794" y="354" width="112" height="44" fill="#10141C"/>
  </g>
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" letter-spacing="0.8" text-anchor="middle">
    <g font-weight="600">
      <text x="106" y="208">--PAPER</text><text x="230" y="208">--PAPER-2</text><text x="354" y="208">--SHEET</text><text x="478" y="208">--INK</text><text x="602" y="208">--INK-2</text><text x="726" y="208">--RULE</text><text x="850" y="208">--SURVEY</text>
      <text x="106" y="310">--MAUVE</text><text x="230" y="310">--MAUVE-2</text><text x="354" y="310">--PINK</text><text x="478" y="310">--AQUA</text><text x="602" y="310">--SAGE</text><text x="726" y="310">--LAV</text><text x="850" y="310">--OCHRE</text>
      <text x="106" y="412">MARKER T4</text><text x="230" y="412">MARKER T2</text><text x="354" y="412">MARKER T1</text><text x="478" y="412">KIND: TOWNS</text><text x="602" y="412">KIND: GARDENS</text><text x="726" y="412">BLOCK: WATER</text><text x="850" y="412">MAP: SPACE</text>
    </g>
    <g fill="#6B625A">
      <text x="106" y="221">#F3EDDC</text><text x="230" y="221">#EAE2CC</text><text x="354" y="221">#F8F4E8</text><text x="478" y="221">#2B2724</text><text x="602" y="221">#6B625A</text><text x="726" y="221">#8E8478</text><text x="850" y="221">#CE2E4E</text>
      <text x="106" y="233">body, wells</text><text x="230" y="233">step, pressed</text><text x="354" y="233">panels, buttons</text><text x="478" y="233">text, borders</text><text x="602" y="233">italics, labels</text><text x="726" y="233">hairlines</text><text x="850" y="233">ink + accent</text>
      <text x="106" y="323">#D8BCD5</text><text x="230" y="323">#B996B6</text><text x="354" y="323">#F2B5C4</text><text x="478" y="323">#9ED8D8</text><text x="602" y="323">#C4D9A6</text><text x="726" y="323">#CFC6E0</text><text x="850" y="323">#F2C48D</text>
      <text x="106" y="335">pressed seg</text><text x="230" y="335">0 CSS uses, block E/W</text><text x="354" y="335">urban, cut face</text><text x="478" y="335">standing, unsure</text><text x="602" y="335">plowed, natural</text><text x="726" y="335">0 uses, kind: forts</text><text x="850" y="335">0 uses, kind: mounds</text>
      <text x="106" y="425">#8A1230</text><text x="230" y="425">#E2697F</text><text x="354" y="425">#F4B4C0</text><text x="478" y="425">#A9C4EC</text><text x="602" y="425">#F0E08A</text><text x="726" y="425">#C4DEDC</text><text x="850" y="425">#10141C</text>
      <text x="106" y="437">L168, 2 uses</text><text x="230" y="437">L170, 2 uses</text><text x="354" y="437">L171, 2 uses</text><text x="478" y="437">L291, 1 use</text><text x="602" y="437">L291, 1 use</text><text x="726" y="437">L1440, 1 use</text><text x="850" y="437">L24, 1 use</text>
    </g>
  </g>

  <!-- ===== 2. type (left) ===== -->
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
    <text x="50" y="482">TYPE SPECIMENS (VENDORED FONTS, SIZES AS SET)</text>
  </g>
  <line x1="50" y1="488" x2="500" y2="488" stroke="#8E8478" stroke-width="1"/>
  <text x="50" y="514" font-size="22" font-weight="700" letter-spacing="3.1">WORDMARK 22</text>
  <text x="50" y="540" font-size="20" font-weight="700" letter-spacing="2">SITE TITLE 20</text>
  <text x="50" y="560" font-size="15" letter-spacing="2.1">CAPTION H2 15 CAPS</text>
  <text x="50" y="582" font-size="15">Body 15px/1.5 Old Standard TT regular, on paper.</text>
  <text x="50" y="601" font-size="13.5" font-style="italic" fill="#6B625A">Tagline, .desc, .fit, .source: Old Standard TT italic 13-13.5px in --ink-2</text>
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif">
    <text x="50" y="622" font-size="11.5" font-weight="600" letter-spacing="1.8">SECTION TITLE 11.5 / .16EM</text>
    <text x="50" y="640" font-size="12" font-weight="600" letter-spacing="1.2" fill="#CE2E4E">&#8592; BACK LINK 12 / .08EM</text>
    <text x="50" y="658" font-size="11" letter-spacing="1">.CAPS STRIP 11 / .09EM · ARCHIVO NARROW 400</text>
    <text x="50" y="678" font-size="10.5" fill="#6B625A">Finding: ArchivoNarrow-600-*.woff2 is byte-identical to the 400 file (md5),</text>
    <text x="50" y="691" font-size="10.5" fill="#6B625A">so every "600" label on the page renders at regular weight.</text>
  </g>

  <!-- ===== 3. markers by tier (right) ===== -->
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
    <text x="540" y="482">MARKERS BY TIER (.MARKER .SQ, L165-172)</text>
  </g>
  <line x1="540" y1="488" x2="906" y2="488" stroke="#8E8478" stroke-width="1"/>
  <g stroke="#2B2724">
    <rect x="556" y="506" width="15" height="15" fill="#8A1230" stroke-width="2"/>
    <rect x="626" y="507" width="13" height="13" fill="#CE2E4E" stroke-width="1.5"/>
    <rect x="696" y="508" width="11" height="11" fill="#E2697F" stroke-width="1.5"/>
    <rect x="766" y="509" width="9"  height="9"  fill="#F4B4C0" stroke-width="1.5"/>
    <rect x="836" y="510" width="7"  height="7"  fill="#F8F4E8" stroke-width="1.5"/>
  </g>
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" letter-spacing="0.8" text-anchor="middle">
    <g font-weight="600">
      <text x="563" y="540">T4 15PX</text><text x="632" y="540">T3 13PX</text><text x="701" y="540">T2 11PX</text><text x="770" y="540">T1 9PX</text><text x="839" y="540">PLAIN 7PX</text>
    </g>
    <g fill="#6B625A">
      <text x="563" y="553">#8A1230</text><text x="632" y="553">--survey</text><text x="701" y="553">#E2697F</text><text x="770" y="553">#F4B4C0</text><text x="839" y="553">--sheet</text>
      <text x="563" y="566">score 2.5+ · 3</text><text x="632" y="566">1.6+ · 11</text><text x="701" y="566">1.2+ · 12</text><text x="770" y="566">0.01+ · 251</text><text x="839" y="566">0 · 108</text>
      <text x="563" y="579">label z0</text><text x="632" y="579">z3</text><text x="701" y="579">z5</text><text x="770" y="579">z7</text><text x="839" y="579">z9, More sites</text>
    </g>
  </g>
  <text x="540" y="602" font-size="13" font-style="italic" fill="#6B625A">older, truer &#8594; newer, rougher  (385 sites in sites.json today)</text>
  <!-- the marker label (.tag) beside a t3 square, as on the map -->
  <g transform="translate(540,616)">
    <rect x="0" y="4" width="13" height="13" fill="#CE2E4E" stroke="#2B2724" stroke-width="1.5"/>
    <rect x="18" y="0" width="92" height="21" fill="#F8F4E8" stroke="#2B2724" stroke-width="1"/>
    <text x="64" y="15" text-anchor="middle" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.9">OLD SARUM</text>
  </g>
  <!-- task 308: the asked-for shape, not built -->
  <g transform="translate(700,614)">
    <path d="M10 0 L20 14 L14 12 L14 22 L6 22 L6 12 L0 14 Z" fill="none" stroke="#8E8478" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="28" y="10" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B625A">task 308: contracting-stem arrowhead,</text>
    <text x="28" y="23" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B625A">tip on the site. Not built yet.</text>
  </g>
  <text x="540" y="662" font-size="10.5" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" fill="#6B625A">All squares 1.5px --ink border (t4 2px); anchor left, offset [-6,0];</text>
  <text x="540" y="675" font-size="10.5" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" fill="#6B625A">higher tiers on top; labels hide on collision, higher tiers placed first.</text>

  <!-- ===== 4. chips and labels ===== -->
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
    <text x="50" y="712">CHIPS, TABS AND BUTTONS (.CHIP L132-136, .TABS L59-62, .TOOLS L79-83, .SEG L64-67)</text>
  </g>
  <line x1="50" y1="718" x2="906" y2="718" stroke="#8E8478" stroke-width="1"/>
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.9" text-anchor="middle">
    <!-- .chip (square, 1px ink, 3px 6px 2px) -->
    <rect x="50" y="732" width="58" height="19" fill="#F8F4E8" stroke="#2B2724" stroke-width="1"/><text x="79" y="745">CONTROL</text>
    <rect x="118" y="732" width="68" height="19" fill="#CE2E4E" stroke="#CE2E4E" stroke-width="1"/><text x="152" y="745" fill="#fff">FOUND · #3</text>
    <rect x="196" y="732" width="74" height="19" fill="#2B2724" stroke="#2B2724" stroke-width="1"/><text x="233" y="745" fill="#F8F4E8">NOT IN LIST</text>
    <rect x="280" y="732" width="60" height="19" fill="#C4D9A6" stroke="#2B2724" stroke-width="1"/><text x="310" y="745">NATURAL</text>
    <rect x="350" y="732" width="60" height="19" fill="#D8BCD5" stroke="#2B2724" stroke-width="1"/><text x="380" y="745">MODERN</text>
    <rect x="420" y="732" width="60" height="19" fill="#9ED8D8" stroke="#2B2724" stroke-width="1"/><text x="450" y="745">UNSURE</text>
    <rect x="490" y="732" width="70" height="19" fill="#F8F4E8" stroke="#2B2724" stroke-width="1" stroke-dasharray="3 2"/><text x="525" y="745" fill="#6B625A">TO REVIEW</text>
    <!-- .tabs: pressed = ink fill -->
    <rect x="580" y="730" width="120" height="24" fill="#2B2724" stroke="#2B2724" stroke-width="1"/><text x="640" y="746" font-size="12" letter-spacing="1.2" fill="#F8F4E8">MAP</text>
    <rect x="700" y="730" width="120" height="24" fill="#F8F4E8" stroke="#2B2724" stroke-width="1"/><text x="760" y="746" font-size="12" letter-spacing="1.2">BLOCK DIAGRAM</text>
    <!-- .tools .primary -->
    <rect x="836" y="730" width="70" height="24" fill="#2B2724" stroke="#2B2724" stroke-width="1"/><text x="871" y="746" font-size="11.5" fill="#F8F4E8">SAVE</text>
  </g>
  <!-- .seg: serif 13.5, pressed = mauve -->
  <g font-size="13.5">
    <rect x="50" y="764" width="150" height="26" fill="#D8BCD5" stroke="#2B2724" stroke-width="1"/><text x="125" y="782" text-anchor="middle" font-weight="700">LiDAR relief</text>
    <rect x="200" y="764" width="150" height="26" fill="#F8F4E8" stroke="#2B2724" stroke-width="1"/><text x="275" y="782" text-anchor="middle">Aerial photograph</text>
    <!-- .gpin: 20px round, survey fill, 1.5px ink, white 700 11px -->
    <circle cx="380" cy="777" r="10" fill="#CE2E4E" stroke="#2B2724" stroke-width="1.5"/><text x="380" y="781" text-anchor="middle" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <circle cx="406" cy="777" r="10" fill="#F8F4E8" fill-opacity="0.9" stroke="#2B2724" stroke-width="1.5"/><text x="406" y="781" text-anchor="middle" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700">2</text>
    <text x="426" y="781" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B625A">.gpin and canvas pins: the only round things, with .kinds i and .swatch.dot</text>
    <!-- focus ring -->
    <rect x="836" y="764" width="70" height="26" fill="#F8F4E8" stroke="#2B2724" stroke-width="1"/>
    <rect x="833" y="761" width="76" height="32" fill="none" stroke="#CE2E4E" stroke-width="2"/>
    <text x="871" y="782" text-anchor="middle" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.7">FOCUS</text>
  </g>

  <!-- ===== 5. overlay: ink and paper ===== -->
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
    <text x="50" y="826">OVERLAY: INK LINES (DEFAULT) AND ORIGINAL PAPER, BOTH AT RASTER-OPACITY 0.85</text>
  </g>
  <line x1="50" y1="832" x2="906" y2="832" stroke="#8E8478" stroke-width="1"/>
  <!-- ground stand-in: a flat green for the aerial photograph (not a page colour) -->
  <g>
    <rect x="50" y="846" width="300" height="130" fill="#4F6B3A"/>
    <g fill="none" stroke="#CE2E4E" stroke-width="1.2" opacity="0.85">
      <ellipse cx="200" cy="920" rx="92" ry="40"/>
      <ellipse cx="200" cy="920" rx="70" ry="27"/>
      <path d="M108 920 L52 920 M292 920 L348 920"/>
    </g>
    <text x="60" y="864" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#F8F4E8">INK LINES · #CE2E4E ON TRANSPARENT</text>
  </g>
  <g>
    <rect x="380" y="846" width="300" height="130" fill="#4F6B3A"/>
    <rect x="400" y="856" width="260" height="110" fill="#F8F4E8" fill-opacity="0.85"/>
    <g fill="none" stroke="#2B2724" stroke-width="1.2" stroke-opacity="0.85">
      <ellipse cx="530" cy="924" rx="92" ry="36"/>
      <ellipse cx="530" cy="924" rx="70" ry="24"/>
      <path d="M438 924 L402 924 M622 924 L658 924"/>
    </g>
    <text x="410" y="872" font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.9">ORIGINAL PAPER · THE SCAN ITSELF</text>
  </g>
  <g font-family="Archivo Narrow, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B625A">
    <text x="710" y="862">Rules: design/survey-red-ink.md</text>
    <text x="710" y="878">one colour #CE2E4E, alpha only</text>
    <text x="710" y="894">paper = 85th pct grey, ink = 2nd</text>
    <text x="710" y="910">gain 1.35, offset -0.18, exp 0.9</text>
    <text x="710" y="926">no fill, no halo, no blend mode</text>
    <text x="710" y="942">layer order: ground, dep, paper, ink</text>
    <text x="710" y="958">green here stands for the aerial</text>
    <text x="710" y="974">photograph; it is not a page colour</text>
  </g>

  <!-- caption (.caption h2 / p) -->
  <line x1="36" y1="990" x2="924" y2="990" stroke="#8E8478" stroke-width="1"/>
  <text x="480" y="1006" text-anchor="middle" font-size="12" letter-spacing="1.7">DESIGN SHEET OF THE ANCIENT WORKS PAGE, AS BUILT</text>
  <text x="480" y="1019" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B625A">Every value from web/index.html; squares are what ships, the arrowhead is task 308. See docs/design.md for the gap list.</text>
</svg>
