<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ancient Works</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F3EDDC'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23CE2E4E' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/maplibre-gl-5.6.0.css">
<style>
/* Layout: a USGS Professional Paper plate. Full-bleed globe on paper; the panel is the plate's EXPLANATION
   column; the block diagram opens as a framed plate sheet over the map. Single paper theme, by design. */
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
:root {
  --paper: #F3EDDC; --paper-2: #EAE2CC; --sheet: #F8F4E8; --ink: #2B2724; --ink-2: #6B625A; --rule: #8E8478;
  --survey: #CE2E4E;            /* 1848 plate ink, as on the ore bodies of USGS plates */
  --mauve: #D8BCD5; --mauve-2: #B996B6; --pink: #F2B5C4; --aqua: #9ED8D8; --sage: #C4D9A6; --lav: #CFC6E0; --ochre: #F2C48D;
  --title: "Old Standard TT", "Century Schoolbook", "Iowan Old Style", Georgia, serif;
  --label: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--title); overflow: hidden; }
#map { position: fixed; inset: 0; background: #10141C; }  /* space around the globe */
.caps { font-family: var(--label); text-transform: uppercase; letter-spacing: .09em; font-size: 11px; }

/* ---------- panel: the EXPLANATION column ---------- */
.panel {
  position: fixed; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; bottom: 12px; width: 370px;
  display: flex; flex-direction: column; background: var(--sheet);
  border: 1px solid var(--ink); outline: 1px solid var(--rule); outline-offset: 3px;
  box-shadow: 0 8px 24px rgba(43, 39, 36, .18);
}
.strip { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px 0; color: var(--ink-2); }
.strip span:last-child { text-align: right; }
.panel-head { padding: 6px 14px 10px; border-bottom: 1px solid var(--ink); text-align: center; }
.wordmark { margin: 0; font: 700 22px/1.1 var(--title); letter-spacing: .14em; text-transform: uppercase; }
.tagline { margin: 3px 0 0; font-style: italic; color: var(--ink-2); font-size: 13.5px; }
.grab { display: none; }
.panel-body { overflow-y: auto; padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.section-title { margin: 0; text-align: center; font: 600 11.5px var(--label); letter-spacing: .16em; text-transform: uppercase; }

.legend-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.entry {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left;
  padding: 7px 6px; background: none; border: 1px solid transparent; color: inherit; font: inherit; cursor: pointer;
}
.entry:hover { border-color: var(--rule); background: var(--paper); }
.entry:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--survey); outline-offset: 2px; }
.swatch { width: 34px; height: 22px; border: 1px solid var(--ink); display: block; }
.swatch.plowed { background: var(--sage); } .swatch.standing { background: var(--aqua); } .swatch.urban { background: var(--pink); }
.swatch.hatch { background: repeating-linear-gradient(135deg, var(--paper) 0 3px, var(--ink-2) 3px 4px); }
.entry .name { display: block; font-weight: 700; font-size: 15.5px; line-height: 1.25; }
.entry .desc { display: block; font-style: italic; color: var(--ink-2); font-size: 13px; line-height: 1.35; }

.back { align-self: flex-start; background: none; border: 0; color: var(--survey); font: 600 12px var(--label); letter-spacing: .08em; text-transform: uppercase; padding: 0; cursor: pointer; }
.site-title { margin: 0; text-align: center; font: 700 20px/1.2 var(--title); letter-spacing: .1em; text-transform: uppercase; text-wrap: balance; }
.site-aka { margin: 4px 0 0; text-align: center; font-style: italic; color: var(--ink-2); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.tabs button { background: var(--sheet); color: var(--ink); border: 0; padding: 8px 6px; font: 600 12px var(--label); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.tabs button + button { border-left: 1px solid var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.group { display: flex; flex-direction: column; gap: 9px; padding: 11px 12px; border: 1px solid var(--rule); background: var(--paper); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.seg button { background: var(--sheet); color: var(--ink); border: 0; padding: 6px; font: 13.5px var(--title); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--mauve); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.row label { flex: 0 0 auto; color: var(--ink-2); font: 12px var(--label); letter-spacing: .06em; text-transform: uppercase; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--survey); }
.val { font: 12px var(--label); color: var(--ink-2); min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
.ramp { height: 10px; border: 1px solid var(--ink); background: linear-gradient(90deg, #2E2622, #B0A492, #FBF7EC); }
.ramp-labels { display: flex; justify-content: space-between; font: 11.5px var(--label); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.summary { margin: 0; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.fit, .source { margin: 0; font-size: 13px; color: var(--ink-2); font-style: italic; }
details.align summary { cursor: pointer; color: var(--survey); font: 600 12px var(--label); letter-spacing: .08em; text-transform: uppercase; }
.pad { display: grid; grid-template-columns: repeat(3, 38px); gap: 5px; }
.pad button, .tools button { background: var(--sheet); color: var(--ink); border: 1px solid var(--ink); font: 15px/1 var(--title); height: 32px; cursor: pointer; }
.pad button:hover, .tools button:hover { background: var(--mauve); }
.tools { display: flex; flex-wrap: wrap; gap: 5px; }
.tools button { padding: 0 10px; font: 600 11.5px var(--label); letter-spacing: .06em; text-transform: uppercase; }
.tools button.primary { background: var(--ink); color: var(--sheet); }
.status { margin: 0; font-size: 13px; color: var(--ink-2); min-height: 1.4em; }
.search { display: flex; gap: 10px; align-items: center; }
.search input[type=search] { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--ink); background: var(--sheet); font: 14px var(--title); color: var(--ink); }
.check { display: flex; gap: 5px; align-items: center; font: 12px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.group-title { margin: 6px 0 2px; font: 600 11.5px var(--label); letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--rule); padding-bottom: 3px; display: flex; justify-content: space-between; }
.group-title span { color: var(--ink-2); font-weight: 400; }
.lede { margin: 0; font-style: italic; }
.kinds { display: flex; flex-wrap: wrap; gap: 4px; }
.kinds button { display: flex; gap: 5px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); padding: 3px 7px; font: 11.5px var(--label); letter-spacing: .04em; color: var(--ink); cursor: pointer; }
.kinds button[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }
.kinds i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); display: inline-block; }
.swatch.dot { border-radius: 50%; width: 16px; height: 16px; margin: 3px 9px; }
.links { display: flex; gap: 12px; font: 600 12px var(--label); letter-spacing: .06em; text-transform: uppercase; }
.links a { color: var(--survey); }
details.plain summary { cursor: pointer; font: 600 11.5px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 6px 0 4px; }
/* plate-fitting tool: an old book page beside the map, matching points clicked on both */
.fitpane { position: absolute; z-index: 6; top: 12px; bottom: 12px; left: 398px; width: min(46vw, 780px); background: var(--sheet); border: 1px solid var(--ink); display: flex; flex-direction: column; box-shadow: 0 2px 12px rgba(43,39,36,.25); }
.fitpane canvas { flex: 1; width: 100%; min-height: 0; cursor: crosshair; touch-action: none; background: var(--paper); display: block; }
.fit-top, .fit-tools { display: flex; gap: 6px; align-items: center; padding: 6px 8px; font: 600 11.5px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.fit-top { border-bottom: 1px solid var(--rule); } .fit-tools { border-top: 1px solid var(--rule); flex-wrap: wrap; }
.fit-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fitpane button { background: var(--sheet); border: 1px solid var(--rule); font: 600 11.5px var(--label); letter-spacing: .05em; padding: 3px 9px; cursor: pointer; color: var(--ink); }
.fitpane button[aria-pressed="true"] { border-color: var(--ink); background: var(--mauve); }
.fitpane.min { bottom: auto; } .fitpane.min canvas, .fitpane.min .fit-tools { display: none; }
@media (max-width: 760px) { .fitpane { left: 0; right: 0; top: 0; width: auto; bottom: 50vh; } }
.gpin { width: 20px; height: 20px; border-radius: 50%; background: var(--survey); color: #fff; border: 1.5px solid var(--ink); font: 700 11px var(--label); display: flex; align-items: center; justify-content: center; cursor: grab; }
.pairs { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: 13.5px; }
.pairs .bad { color: var(--survey); font-weight: 600; }
.plans { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 46vh; overflow: auto; }
.plans button { width: 100%; text-align: left; background: var(--sheet); border: 1px solid var(--rule); padding: 6px 8px; cursor: pointer; color: var(--ink); font: 14px var(--title); }
.plans button:hover { border-color: var(--ink); }
.plans small { display: block; font: 600 11px var(--label); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); margin-top: 2px; }
.step { margin: 0; padding: 7px 9px; border: 1px solid var(--ink); background: var(--paper-2); font-size: 14px; }
.deps { display: grid; border: 1px solid var(--ink); }
.deps button { background: var(--sheet); color: var(--ink); border: 0; padding: 6px 9px; font: 13.5px var(--title); text-align: left; cursor: pointer; }
.deps button + button { border-top: 1px solid var(--rule); }
.deps button[aria-pressed="true"] { background: var(--mauve); }
.deps .yr { font: 600 11.5px var(--label); letter-spacing: .06em; color: var(--ink-2); margin-left: 4px; }
.about { display: grid; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.about p { margin: 0; }

/* ---------- finder ---------- */
.known { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
.known li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
.known i { color: var(--ink-2); font-size: 12.5px; grid-column: 1 / -1; margin-top: -3px; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; text-decoration: underline dotted var(--rule); }
.linkish[aria-current="true"] { font-weight: 700; color: var(--survey); }
#mnote { width: 100%; box-sizing: border-box; font: 13.5px var(--title); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 6px; resize: vertical; }
.chip { font: 600 10.5px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px 2px; border: 1px solid var(--ink); white-space: nowrap; background: var(--sheet); color: var(--ink); }
.chip.found, .chip.v-earthwork { background: var(--survey); color: #fff; border-color: var(--survey); }
.chip.missed { background: var(--ink); color: var(--sheet); }
.chip.v-natural { background: var(--sage); } .chip.v-modern { background: var(--mauve); } .chip.v-unsure { background: var(--aqua); }
.chip.todo { color: var(--ink-2); border-style: dashed; }
.cands { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.cand { display: grid; grid-template-columns: 56px 1fr auto; gap: 9px; align-items: center; width: 100%; text-align: left; padding: 4px; background: none; border: 1px solid transparent; color: inherit; font: inherit; cursor: pointer; }
.cand:hover { border-color: var(--rule); background: var(--paper); }
.cand[aria-current="true"] { border-color: var(--ink); background: var(--paper-2); }
.cand img { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--ink); display: block; background: var(--paper-2); }
.cand b { display: block; font-size: 14px; line-height: 1.2; }
.cand small { display: block; font-style: italic; color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.card { display: grid; gap: 9px; padding: 11px 12px; border: 1px solid var(--ink); background: var(--paper); }
.card .crop { position: relative; border: 1px solid var(--ink); background: var(--paper-2); aspect-ratio: 1; }
.card .crop img { width: 100%; height: 100%; display: block; object-fit: contain; }
.card .crop svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.card .stats { margin: 0; font-size: 13px; color: var(--ink-2); font-style: italic; }
.verdicts { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--ink); }
.verdicts button { background: var(--sheet); border: 0; padding: 7px 2px; font: 600 11px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
.verdicts button + button { border-left: 1px solid var(--ink); }
.verdicts button[aria-pressed="true"][data-v="earthwork"] { background: var(--survey); color: #fff; }
.verdicts button[aria-pressed="true"][data-v="natural"] { background: var(--sage); }
.verdicts button[aria-pressed="true"][data-v="modern"] { background: var(--mauve); }
.verdicts button[aria-pressed="true"][data-v="unsure"] { background: var(--aqua); }
.verdicts button:disabled { color: var(--rule); cursor: not-allowed; }
.marker.scan .sq { background: var(--sheet); border-style: dashed; }

/* ---------- markers ---------- */
.marker { display: flex; align-items: center; gap: 0; cursor: pointer; background: none; border: 0; padding: 0; }
.marker .sq { width: 11px; height: 11px; border: 1.5px solid var(--ink); background: var(--survey); }
/* tiers by score (TIERS in the script): bigger and darker = older overlays that line up with the ground.
   plain = no overlay 150+ years old (LiDAR or the photograph only), shown only with More sites */
.marker.t4 .sq { width: 15px; height: 15px; border-width: 2px; background: #8A1230; }
.marker.t3 .sq { width: 13px; height: 13px; background: var(--survey); }
.marker.t2 .sq { width: 11px; height: 11px; background: #E2697F; }
.marker.t1 .sq { width: 9px; height: 9px; background: #F4B4C0; }
.marker.plain .sq { width: 7px; height: 7px; border-width: 1.5px; background: var(--sheet); }
.marker.t4 .tag { font-weight: 700; }
.tiers { display: flex; align-items: center; gap: 6px; font: 11.5px var(--label); letter-spacing: .04em; color: var(--ink-2); }
.tiers .sq { display: inline-block; border: 1.5px solid var(--ink); }
.tiers .t4 { width: 15px; height: 15px; background: #8A1230; } .tiers .t3 { width: 13px; height: 13px; background: var(--survey); }
.tiers .t2 { width: 11px; height: 11px; background: #E2697F; } .tiers .t1 { width: 9px; height: 9px; background: #F4B4C0; }
.tiers .plain { width: 7px; height: 7px; background: var(--sheet); }
.marker .tag { margin-left: 5px; padding: 1px 6px; background: var(--sheet); border: 1px solid var(--ink); font: 600 11px var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }

.maplibregl-ctrl-attrib { font: 10.5px var(--label) !important; background: rgba(248, 244, 232, .85) !important; }
.maplibregl-ctrl-group { background: var(--sheet) !important; border: 1px solid var(--ink) !important; border-radius: 0 !important; box-shadow: none !important; }
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--ink) !important; }

/* ---------- the plate sheet (block diagram) ---------- */
.sheet {
  position: fixed; z-index: 3; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; bottom: 12px; left: 396px;
  display: grid; grid-template-rows: auto 1fr auto; background: var(--sheet);
  border: 1px solid var(--ink); outline: 1px solid var(--rule); outline-offset: 3px; box-shadow: 0 8px 24px rgba(43, 39, 36, .2);
}
.sheet-strip { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 14px 4px; color: var(--ink-2); }
.sheet-close { background: var(--sheet); border: 1px solid var(--ink); color: var(--ink); font: 600 11.5px var(--label); letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; cursor: pointer; }
.sheet-close:hover { background: var(--mauve); }
.sheet-main { position: relative; display: grid; grid-template-columns: 1fr 230px; min-height: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 14px; }
.stage { position: relative; min-height: 0; min-width: 0; cursor: grab; touch-action: none; }
.stage:active { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.compass { position: absolute; left: 14px; bottom: 14px; width: 54px; height: 54px; pointer-events: none; }
.hint { position: absolute; right: 12px; bottom: 10px; font: 11px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-style: italic; color: var(--ink-2); }
.explain { border-left: 1px solid var(--rule); padding: 12px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.explain .section-title { margin-bottom: 2px; }
.key { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; font-size: 12.5px; line-height: 1.3; }
.key .swatch { width: 30px; height: 18px; }
.key b { display: block; font-size: 13px; }
.key i { color: var(--ink-2); }
.toggle { display: flex; gap: 8px; align-items: center; font: 12px var(--label); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.toggle input { accent-color: var(--survey); width: 16px; height: 16px; }
.caption { padding: 8px 14px 10px; text-align: center; }
.caption h2 { margin: 0; font: 400 15px/1.3 var(--title); letter-spacing: .14em; text-transform: uppercase; text-wrap: balance; }
.caption p { margin: 3px 0 0; font: italic 12.5px var(--title); color: var(--ink-2); }

@media (max-width: 760px) {
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 54%; outline: none; border-width: 1px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel.collapsed { max-height: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .panel.collapsed .panel-body { display: none; }
  .grab { display: block; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 44px; height: 5px;
    background: var(--rule); border: 0; padding: 0; cursor: pointer; }
  .strip { padding-top: 14px; }
  .sheet { left: 0; right: 0; top: 0; bottom: 0; outline: none; border: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; margin: 0 10px; }
  .explain { border-left: 0; border-top: 1px solid var(--rule); max-height: 32vh; }
}
</style>
</head>
<body>

<div id="map" aria-label="Globe of earthwork sites"></div>

<aside class="panel" id="panel">
  <button class="grab" id="grab" aria-label="Show or hide the panel"></button>
  <div class="strip caps"><span>Ancient Works</span><span>LiDAR and the old surveys</span></div>
  <header class="panel-head">
    <h1 class="wordmark">Ancient Works</h1>
    <p class="tagline">Old earthworks in old surveys and today's ground</p>
  </header>
  <div class="panel-body" id="body"></div>
</aside>

<section class="fitpane" id="fitpane" hidden aria-label="Old plan">
  <div class="fit-top"><span class="fit-name" id="fitname"></span><button id="fitmin">Hide plan</button></div>
  <canvas id="fitcv"></canvas>
  <div class="fit-tools"><button id="fz-in" aria-label="Zoom in">+</button><button id="fz-out" aria-label="Zoom out">−</button><button id="fz-all">Whole page</button><button id="fcrop" aria-pressed="false">Crop to the plan</button><span id="fithint" style="flex:1;text-align:right;text-transform:none;letter-spacing:0;font-weight:400"></span></div>
</section>

<section class="sheet" id="sheet" hidden aria-label="Isometric block diagram">
  <div class="sheet-strip caps"><span id="sheet-left">Ancient Works</span><button class="sheet-close" id="sheet-close">Back to map</button></div>
  <div class="sheet-main">
    <div class="stage" id="stage">
      <div class="loading" id="loading">Building the block…</div>
      <svg class="compass" id="compass" viewBox="-30 -30 60 60" aria-hidden="true">
        <circle r="27" fill="none" stroke="#8E8478" stroke-width="0.8"/><g id="needle"><line x1="0" y1="16" x2="0" y2="-12" stroke="#2B2724" stroke-width="1.4"/><path d="M0 -17 L4.5 -7 L0 -9.5 L-4.5 -7 Z" fill="#2B2724"/><text x="0" y="-19" text-anchor="middle" font-family="Archivo Narrow, sans-serif" font-size="9" font-weight="600" fill="#2B2724">N</text></g>
      </svg>
      <span class="hint">Drag to turn · pinch or scroll to zoom</span>
    </div>
    <div class="explain" id="explain"></div>
  </div>
  <div class="caption"><h2 id="cap-title"></h2><p id="cap-sub"></p></div>
</section>

<script src="vendor/maplibre-gl-5.6.0.js"></script>

<script>
// live LiDAR relief tiles (server/relief_tiles.py, z12-17). The server picks the DEM for each tile; one source per

const RELIEF_URL = location.origin + location.pathname.replace(/[^/]*$/, '') + 'tiles/relief/{z}/{x}/{y}.webp';

  { id: 'relief-ea', attribution: 'LiDAR: Environment Agency, &copy; Crown copyright, Open Government Licence v3.0',

  { id: 'relief-ign', attribution: 'LiDAR: IGN LiDAR HD, Licence Ouverte 2.0',
    boxes: [[-4.9, 42.3, -1.95, 48.9], [-1.95, 42.3, 1.4, 49.8], [1.4, 42.3, 4.3, 51.15], [4.3, 42.3, 8.25, 50.2], [8.5, 41.3, 9.65, 43.05]] },
];
RELIEF.forEach(r => r.bounds = [0, 1, 2, 3].map(i => (i < 2 ? Math.min : Math.max)(...r.boxes.map(b => b[i]))));
const STATUS = { plowed: 'Walls plowed down', standing: 'Walls standing', urban: 'Mostly under a town' };
// catalog pins (web/data/catalog.json from tools/export_catalog.py): every known earthwork, built or not
const C = { rows: [], byId: {}, kind: 'all' };
const KIND = {
  hillfort: ['Hillfort', 'forts'], enclosure: ['Enclosure', 'enclosures'], causewayed_enclosure: ['Causewayed enclosure', 'enclosures'],
  henge: ['Henge', 'enclosures'], earthwork: ['Earthwork', 'enclosures'], barrow: ['Barrow', 'mounds'], mound_site: ['Mound site', 'mounds'],
  platform_mound: ['Platform mound', 'mounds'], effigy_mound: ['Effigy mound', 'mounds'], motte: ['Motte', 'mottes'],
  roman_fort: ['Roman fort', 'military'], military_earthwork: ['Military earthwork', 'military'], linear_earthwork: ['Dyke or linear earthwork', 'linear'],
  terp: ['Terp (dwelling mound)', 'terps'], castle: ['Castle', 'mottes'], town: ['Walled town', 'towns'], garden: ['House and garden', 'gardens'],
};
const KGROUP = { forts: ['Hillforts', '#CFC6E0'], enclosures: ['Enclosures and henges', '#9ED8D8'], mounds: ['Barrows and mounds', '#F2C48D'],
  mottes: ['Mottes and castles', '#F2B5C4'], military: ['Roman and military forts', '#D8BCD5'], linear: ['Dykes', '#C4D9A6'], terps: ['Terps', '#EAE2CC'],
  towns: ['Walled towns', '#A9C4EC'], gardens: ['Lost gardens', '#F0E08A'] };
const kindLabel = k => (KIND[k] || [k.replace(/_/g, ' ')])[0];
const kindGroup = k => (KIND[k] || [0, 'enclosures'])[1];
const RELIEF_SRC = { US: 'USGS 3DEP', England: 'Environment Agency', Wales: 'Environment Agency (where it covers Wales)', Netherlands: 'AHN', France: 'IGN LiDAR HD' };
const S = { sites: [], byId: {}, sel: null, ground: 'relief', plateMode: 'ink', plateOpacity: 0.85, align: {}, loaded: new Set(), db: null };
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const narrow = () => matchMedia('(max-width: 760px)').matches;
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
S.ground = lsGet('aw.ground', 'relief'); S.plateMode = lsGet('aw.plateMode', 'ink'); S.plateOpacity = lsGet('aw.plateOpacity', 0.85);
S.dep = {}; S.depUrl = {}; S.depAlign = {}; S.alignStep = lsGet('aw.alignStep', 'fine'); S.drag = null; S.depSel = lsGet('aw.depSel', {}); S.depOpacity = lsGet('aw.depOpacity', 0.85); S.depMode = lsGet('aw.depMode', 'ink');

// The base map is the aerial photograph on the globe, all the way out. Ethan 2026-10-10: the old 4096 px world
// picture "gets blurry and ugly" and "has no drip", and the photograph only came in about 50 km out; a plate-style
// vector map (OpenFreeMap + Mapterhorn hill shading, d939bd2) was tried side by side and lost: "satellite global all
// the way out is better and way faster".
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8, projection: { type: 'globe' },
    sources: {
      sat: { type: 'raster', tileSize: 256, maxzoom: 19,
             tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] },
      // source minzoom (not layer minzoom): no tiles below z12, but the credit stays while per-site relief shows
      ...Object.fromEntries(RELIEF.map(r => [r.id, { type: 'raster', tileSize: 256, minzoom: 12, maxzoom: 17,
        bounds: r.bounds, attribution: r.attribution, tiles: [RELIEF_URL] }])),
    },
    layers: [
      { id: 'sat', type: 'raster', source: 'sat', paint: { 'raster-fade-duration': 0 } },
      // beneath everything added later (per-site relief, plates, finder crops)
      ...RELIEF.map(r => ({ id: r.id, type: 'raster', source: r.id, layout: { visibility: 'none' },
        paint: { 'raster-fade-duration': 0, 'raster-resampling': 'linear' } })),
    ],
    sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] },
  },
  center: [-86, 38.5], zoom: 2.3, maxZoom: 18, attributionControl: false,
});
// on phones the bottom sheet covers the lower half: centre the globe in the visible part
if (narrow()) map.setPadding({ top: 0, left: 0, right: 0, bottom: innerHeight * 0.5 });
map.once('load', () => { S.mapLoaded = true; });  // isStyleLoaded() is false while tiles load, so it cannot tell
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution:
  'Aerial photographs: Esri, Maxar, Earthstar Geographics · Plates: Squier &amp; Davis 1848' }), 'bottom-right');

/* ---------- geometry ---------- */
const R = 6378137;
const merc = ([lon, lat]) => [lon * Math.PI / 180 * R, Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * R];
const unmerc = ([x, y]) => [x / R * 180 / Math.PI, (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI];
function alignedCorners(site) { return shiftCorners(site.plate.corners, S.align[site.id], site.lat); }
// an overlay moved by hand from its fitted corners: dx/dy metres east/north, rot degrees clockwise, scale about its centre
function shiftCorners(corners, a, lat) {
  a = a || { dx: 0, dy: 0, rot: 0, scale: 1 };
  const pts = corners.map(merc);
  const cx = pts.reduce((s, p) => s + p[0], 0) / 4, cy = pts.reduce((s, p) => s + p[1], 0) / 4;
  const k = 1 / Math.cos(lat * Math.PI / 180);
  const t = -a.rot * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);  // positive rot = clockwise, like a compass
  return pts.map(([x, y]) => {
    const dx = (x - cx) * a.scale, dy = (y - cy) * a.scale;
    return unmerc([cx + dx * c - dy * s + a.dx * k, cy + dx * s + dy * c + a.dy * k]);
  });
}

/* ---------- map layers ---------- */
function ensureSite(site) {
  // not map.isStyleLoaded(): that is false whenever any tiles are still loading (live relief!), and the site's
  // layers then never got added while the map kept loading
  if (S.loaded.has(site.id) || !S.ready) return;
  S.loaded.add(site.id);
  const base = `data/sites/${site.id}/`;
  const paint = { 'raster-fade-duration': 0, 'raster-resampling': 'linear' };
  if (site.lidar !== false) {  // aerial-only sites (no open LiDAR there) have no relief image
    map.addSource(`rel-${site.id}`, { type: 'image', url: base + 'relief.jpg', coordinates: site.corners });
    map.addLayer({ id: `rel-${site.id}`, type: 'raster', source: `rel-${site.id}`, paint });
  }
  if (site.plate) {
    const pc = alignedCorners(site);
    map.addSource(`ink-${site.id}`, { type: 'image', url: base + site.plate.ink, coordinates: pc });
    map.addSource(`paper-${site.id}`, { type: 'image', url: base + site.plate.paper, coordinates: pc });
    map.addLayer({ id: `paper-${site.id}`, type: 'raster', source: `paper-${site.id}`, paint });
    map.addLayer({ id: `ink-${site.id}`, type: 'raster', source: `ink-${site.id}`, paint });
  }
  applyLayers(site);
  applyDep(site);
}
function applyLayers(site) {
  if (!S.loaded.has(site.id)) return;
  if (map.getLayer(`rel-${site.id}`)) map.setLayoutProperty(`rel-${site.id}`, 'visibility', S.ground === 'relief' ? 'visible' : 'none');
  if (site.plate) for (const mode of ['ink', 'paper']) {
    const id = `${mode}-${site.id}`;
    map.setLayoutProperty(id, 'visibility', S.plateMode === mode && S.plateOpacity > 0 ? 'visible' : 'none');
    map.setPaintProperty(id, 'raster-opacity', S.plateOpacity);
  }
}
function applyRelief() {
  let v = null;
  try { const b = map.getBounds(); v = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]; if (v[0] > v[2]) v = null; } catch {}
  for (const r of RELIEF) {
    if (!map.getLayer(r.id)) continue;
    const onScreen = !v || r.boxes.some(b => v[0] <= b[2] && v[2] >= b[0] && v[1] <= b[3] && v[3] >= b[1]);
    map.setLayoutProperty(r.id, 'visibility', S.ground === 'relief' && onScreen ? 'visible' : 'none');
  }
}
map.on('moveend', applyRelief);
const applyAll = () => {
  applyRelief();
  S.sites.forEach(applyLayers);
};
function moveplate(site) {
  if (!S.loaded.has(site.id) || !site.plate) return;
  const pc = alignedCorners(site);
  map.getSource(`ink-${site.id}`).setCoordinates(pc);
  map.getSource(`paper-${site.id}`).setCoordinates(pc);
}
/* ---------- old maps and aerials (pipeline/topo.py, pipeline/depict.py -> data/sites/<id>/depictions.json) ---------- */
// plain surveys (maps, aerials, USGS topos) only when at least 150 years old: the point is how little the works changed
// (Ethan 2026-10-10). Plans and drawings of the works stay whatever their age.
const SURVEY_KINDS = new Set(['map', 'aerial', 'topo']);
const surveyOldEnough = x => !SURVEY_KINDS.has(x.kind) || (x.year && x.year <= new Date().getFullYear() - 150);
async function loadDeps(s) {
  if (S.dep[s.id]) return S.dep[s.id];
  // USGS topographic quads left out (Ethan 2026-10-10: "they don't really ever show anything")
  try { const r = await fetch(`data/sites/${s.id}/depictions.json`); S.dep[s.id] = (r.ok ? (await r.json()).depictions || [] : []).filter(surveyOldEnough); }
  catch { S.dep[s.id] = []; }

}
function applyDep(s) {
  if (!S.loaded.has(s.id)) return;
  const id = `dep-${s.id}`, d = (S.dep[s.id] || []).find(x => x.file === S.depSel[s.id]);
  if (!d) { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none'); return; }
  const url = `data/sites/${s.id}/${S.depMode === 'ink' && d.ink ? d.ink : d.file}`;
  const coordinates = shiftCorners(d.corners, S.depAlign[depKey(s, d)], s.lat);
  if (!map.getSource(id)) {
    map.addSource(id, { type: 'image', url, coordinates });
    // above the ground, below the plate
    map.addLayer({ id, type: 'raster', source: id, paint: { 'raster-fade-duration': 0, 'raster-resampling': 'linear' } },
      map.getLayer(`paper-${s.id}`) ? `paper-${s.id}` : undefined);
  } else if (S.depUrl[id] !== url) map.getSource(id).updateImage({ url, coordinates });
  else map.getSource(id).setCoordinates(coordinates);

  map.setLayoutProperty(id, 'visibility', 'visible');
  map.setPaintProperty(id, 'raster-opacity', S.depOpacity);
}
const depKey = (s, d) => `${s.id}.${d.file}`;
function setDep(s, file) {
  S.depSel[s.id] = file; lsSet('aw.depSel', S.depSel); applyDep(s); renderSite(s); if (B.open) setTab(true);
}

function lazyLoad() {
  if (map.getZoom() < 10) return;
  const c = map.getCenter();
  for (const s of S.sites) if (Math.abs(s.lon - c.lng) < 0.4 && Math.abs(s.lat - c.lat) < 0.3) ensureSite(s);
}
map.on('moveend', lazyLoad);
for (const [ev, fn] of [['mousedown', dragStart], ['touchstart', dragStart], ['mousemove', dragAt], ['touchmove', dragAt], ['mouseup', dragEnd], ['touchend', dragEnd]]) map.on(ev, fn);

// Marker tiers from the site's score (pipeline/build_site.py score: centuries old x how well it lines up, best overlay
// plus a quarter of the rest). Ethan 2026-10-10: the oldest and truest should be the most prominent, and only sites
// with an overlay at least 150 years old show until the viewer asks for more ("More sites": LiDAR or photograph only).
// Today (277 scored): t4 = Bergues 1545, Mayburgh 1769, Old Sarum 1761; t3 = the 1848 plates; t2 = plans of c.1900 on
// an 1840s Ordnance Survey sheet; t1 = old survey sheets only (Etat-major 1.0, Cassini alone 0.2).
const TIERS = [[2.5, 't4'], [1.6, 't3'], [1.2, 't2'], [0.01, 't1']];
const tierOf = s => (TIERS.find(t => (s.score || 0) >= t[0]) || [0, 'plain'])[1];
const LABEL_FROM = { t4: 0, t3: 3, t2: 5, t1: 7, plain: 9 };  // zoom from which a tier's names show
const markers = [];
let syncMarkers = () => {};
function shown(s) {  // on the map: scored sites, the rest only with More sites; the kind chips filter both
  return (s.score > 0 || S.more) && (C.kind === 'all' || kindGroup(s.kind || 'earthwork') === C.kind);
}
function addMarkers() {
  for (const s of S.sites) {
    const el = document.createElement('button');
    el.className = `marker ${tierOf(s)}`; el.type = 'button'; el.setAttribute('aria-label', `Open ${s.name}`);
    el.innerHTML = `<span class="sq"></span><span class="tag">${esc(s.name)}</span>`;
    el.addEventListener('click', e => { e.stopPropagation(); select(s.id); });
    markers.push({ id: s.id, el, m: new maplibregl.Marker({ element: el, anchor: 'left', offset: [-6, 0] }).setLngLat([s.lon, s.lat]).addTo(map) });
  }
  // squares stay clickable at every zoom (Ethan 2026-10-10: they used to vanish past ~z12.5, so a site could not be
  // opened from close in); only the open site's own square goes, as it would sit on its overlay. A label (not its
  // square) hides when it would overlap another square or a label already placed; higher tiers are placed first.
  syncMarkers = () => {
    const z = map.getZoom(), pts = new Map(), placed = [], on = [];
    for (const k of markers) {
      const s = S.byId[k.id];
      if (!s) continue;  // a Finder search area's marker (addScanAreas): always shown
      const vis = shown(s) && k.id !== S.sel;
      k.el.style.display = vis ? '' : 'none';
      if (vis) { pts.set(k, map.project(k.m.getLngLat())); on.push(k); }
    }
    const squares = on.map(k => { const p = pts.get(k); return [p.x - 8, p.y - 8, p.x + 8, p.y + 8, k]; });
    for (const k of on.sort((a, b) => (S.byId[b.id].score || 0) - (S.byId[a.id].score || 0))) {
      const s = S.byId[k.id], tag = k.el.querySelector('.tag'), p = pts.get(k);
      if (z < LABEL_FROM[tierOf(s)]) { tag.style.visibility = 'hidden'; continue; }
      const box = [p.x + 6, p.y - 10, p.x + 12 + tag.offsetWidth, p.y + 10];
      const over = b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1];
      // a label may cover the squares of lower tiers; it yields to squares of its own tier or higher
      const hit = placed.some(over) || squares.some(b => b[4] !== k && over(b) && (S.byId[b[4].id].score || 0) >= (s.score || 0));
      tag.style.visibility = hit ? 'hidden' : '';
      if (!hit) placed.push(box);

}

/* ---------- panel ---------- */
// the site catalog (web/data/catalog.json from tools/export_catalog.py): every known earthwork, built or not. Not on
// the map (Ethan 2026-10-10: "we shouldn't be pinning every single earthwork in the world"); found by search under
// More sites, where opening one shows the live relief or the photograph at its place.
function setKind(k) { C.kind = k; syncMarkers(); renderList(); }
function selectCat(id) {
  A.sel = null; A.mark = null; if (typeof refreshMarks === "function" && map.getSource("amazon-marks")) refreshMarks();
  if (S.byId[id]) return select(id);
  const r = C.byId[id]; if (!r) return;
  if (B.open) closeBlock();
  S.sel = null; F.sel = null; syncMarkers();
  $('#body').innerHTML = `
    <button class="back" id="back">← All sites</button>
    <div><h2 class="site-title">${esc(r.name)}</h2><p class="site-aka">${esc([kindLabel(r.kind), r.place, r.region].filter(Boolean).join(' · '))}</p></div>
    <div class="group">
      <p class="section-title">Ground</p>
      <div class="seg" role="group" aria-label="Ground layer">
        <button id="g-relief" aria-pressed="${S.ground === 'relief'}">LiDAR relief</button>
        <button id="g-imagery" aria-pressed="${S.ground === 'imagery'}">Aerial photograph</button>
      </div>
      <p class="fit">${RELIEF_SRC[r.region] ? `Relief streams live from ${esc(RELIEF_SRC[r.region])} as you zoom in (first view of a new area takes a few seconds).` : 'No open LiDAR here.'}</p>
    </div>
    ${r.period ? `<p class="summary">Period: ${esc(r.period)}.</p>` : ''}
    <p class="summary">Not built yet: no block diagram or old maps for this one. The pin comes from the site catalog.</p>
    <div class="links">${r.wiki ? `<a href="${esc(r.wiki)}" target="_blank" rel="noopener">Wikipedia</a>` : ''}${r.qid ? `<a href="https://www.wikidata.org/wiki/${esc(r.qid)}" target="_blank" rel="noopener">Wikidata</a>` : ''}</div>`;
  $('#back').onclick = () => { renderList(); map.flyTo({ center: [-86, 38.5], zoom: 2.3, duration: 2500 }); };
  $('#g-relief').onclick = () => { setGround('relief'); selectCat(id); };
  $('#g-imagery').onclick = () => { setGround('imagery'); selectCat(id); };
  if (narrow()) $('#panel').classList.remove('collapsed');
  const pad = narrow() ? { bottom: innerHeight * 0.5, top: 20, left: 20, right: 20 } : { left: 390, top: 20, right: 20, bottom: 20 };
  map.flyTo({ center: [r.lon, r.lat], zoom: narrow() ? 15 : 15.6, duration: 4000, essential: true, padding: pad });
  try { history.replaceState(null, '', '#c/' + id); } catch {}
}
function catMatches() {
  const q = S.q.trim().toLowerCase();
  if (!q || !S.more) return [];
  const out = [];
  for (const r of C.rows) {
    if (S.byId[r.id] || (C.kind !== 'all' && kindGroup(r.kind) !== C.kind)) continue;
    if (r.name.toLowerCase().includes(q) || (r.place && r.place.toLowerCase().includes(q))) { out.push(r); if (out.length >= 40) break; }
  }
  return out;
}

/* ---------- home: Sites and Finder tabs ---------- */
S.tab = lsGet('aw.tab', 'sites'); S.q = ''; S.more = false;  // More sites: off on every visit
const regionOf = s => s.region || String(s.place || '').split(',').pop().trim() || 'Other';
function siteMatches(s) {
  if (!shown(s)) return false;
  const q = S.q.trim().toLowerCase();
  return !q || [s.name, s.aka, s.place, s.kind].some(v => v && String(v).toLowerCase().includes(q));
}
function siteEntries() {
  const groups = {};
  for (const s of S.sites.filter(siteMatches)) (groups[regionOf(s)] = groups[regionOf(s)] || []).push(s);
  Object.values(groups).forEach(g => g.sort((a, b) => (b.score || 0) - (a.score || 0)));
  const names = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b));
  const cm = catMatches();
  if (!names.length && !cm.length) return '<p class="status">No site matches.</p>';
  return names.map(g => `
    <p class="group-title">${esc(g)} <span>${groups[g].length}</span></p>
    <ul class="legend-list">${groups[g].map(s => `
      <li><button class="entry" data-id="${esc(s.id)}">
        <span class="tiers"><span class="sq ${tierOf(s)}"></span></span>
        <span><span class="name">${esc(s.name)}</span><span class="desc">${esc([s.kind ? kindLabel(s.kind) : '', s.place].filter(Boolean).join(', '))}.${s.oldest ? ` Oldest overlay ${s.oldest}${s.overlays > 1 ? `, ${s.overlays} in all` : ''}.` : ''}${s.lidar === false ? ' Aerial photograph only.' : ''}</span></span>
      </button></li>`).join('')}</ul>`).join('') + (cm.length ? `
    <p class="group-title">From the catalog <span>${cm.length === 40 ? 'first 40' : cm.length}</span></p>
    <ul class="legend-list">${cm.map(r => `
      <li><button class="entry" data-cat="${esc(r.id)}">
        <span class="swatch dot" style="background:${KGROUP[kindGroup(r.kind)][1]}"></span>
        <span><span class="name">${esc(r.name)}</span><span class="desc">${esc([kindLabel(r.kind), r.place, r.region].filter(Boolean).join(', '))}</span></span>
      </button></li>`).join('')}</ul>` : '');
}
function bindEntries() {
  $('#body').querySelectorAll('.entry[data-cat]').forEach(b => b.addEventListener('click', () => selectCat(b.dataset.cat)));
  $('#body').querySelectorAll('.entry[data-id]').forEach(b => b.addEventListener('click', () => select(b.dataset.id)));
  $('#body').querySelectorAll('.entry[data-scan]').forEach(b => b.addEventListener('click', () => selectScan(b.dataset.scan)));
  $('#body').querySelectorAll('.entry[data-area]').forEach(b => b.addEventListener('click', () => selectArea(b.dataset.area)));
}
function setTabHome(t) { S.tab = t; lsSet('aw.tab', t); renderList(); try { history.replaceState(null, '', t === 'finder' ? '#finder' : location.pathname + location.search); } catch {} }
function renderList() {
  const n = S.sites.length, nc = C.rows.filter(r => !S.byId[r.id]).length;
  $('#body').innerHTML = `
    <div class="tabs" role="group" aria-label="Section">
      <button id="h-sites" aria-pressed="${S.tab !== 'finder'}">Sites</button>
      <button id="h-finder" aria-pressed="${S.tab === 'finder'}">Finder</button>
    </div>

  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const [px, py] = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);

}

/* ---------- document store on the local server (same shape as the old artifact db) ---------- */
async function openDb() {
  const url = p => 'api/db/' + p.split('/').map(encodeURIComponent).join('/');
  try { if (!(await fetch(url('ping'))).ok) return null; } catch { return null; }
  return {
    doc: path => ({
      async get() {
        const r = await fetch(url(path));
        if (r.status === 404) return { exists: false, data: () => undefined };
        if (!r.ok) throw new Error(`db get ${r.status}`);
        const d = await r.json();
        return { exists: true, data: () => d };
      },
      async set(data) {
        const r = await fetch(url(path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        if (!r.ok) throw new Error(`db set ${r.status}`);
      },
      async delete() {
        const r = await fetch(url(path), { method: 'DELETE' });
        if (!r.ok && r.status !== 404) throw new Error(`db delete ${r.status}`);
      },
    }),
    collection: name => ({
      async get() {
        const r = await fetch(url(name));
        if (!r.ok) throw new Error(`db list ${r.status}`);
        const { docs } = await r.json();
        return { docs: docs.map(d => ({ id: d.id, data: () => d.data })) };
      },
    }),
  };
}

    try {
      const snap = await db.collection('verdicts').get();
      for (const doc of snap.docs) { const v = doc.data(); if (VERDICT[v.v]) F.verdicts[doc.id] = { scan: v.scan, v: v.v }; }
      Object.keys(F.data).forEach(refreshCands);
    } catch {}
    try {
      for (const doc of (await db.collection('marks').get()).docs) A.marks[doc.id] = doc.data();
      for (const doc of (await db.collection('surveyseen').get()).docs) A.seen[doc.id] = doc.data();
      refreshMarks();
    } catch {}
    if (S.sel) { renderSite(S.byId[S.sel]); if (B.open) setTab(true); }
    else if (A.sel) renderArea(A.sel);
    else if (F.sel) renderScan(F.sel);
    else renderList();
  });
}
boot();
</script>
</body>
</html>
